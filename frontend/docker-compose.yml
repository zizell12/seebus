services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://seebus.local/api}
    container_name: seebus_frontend
    restart: always
    ports:
      - "5173:80"
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seebus_frontend.rule=Host(`seebus.local`) && !PathPrefix(`/api`)"
      - "traefik.http.services.seebus_frontend.loadbalancer.server.port=80"

networks:
  proxy_net:
    external: true
    name: ${PROXY_NETWORK:-proxy}
